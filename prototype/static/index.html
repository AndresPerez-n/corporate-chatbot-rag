<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Acme Corp Assistant</title>
<style>
  :root {
    --bg: #0f1115; --panel: #181b22; --user: #2b6cb0; --bot: #232732;
    --text: #e6e8ec; --muted: #8b919e; --accent: #4fd1c5; --border: #2a2e38;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: -apple-system, Segoe UI, Roboto, sans-serif;
    background: var(--bg); color: var(--text); height: 100vh;
    display: flex; flex-direction: column;
  }
  header {
    padding: 14px 20px; border-bottom: 1px solid var(--border);
    background: var(--panel); display: flex; align-items: center; gap: 10px;
  }
  header h1 { font-size: 16px; margin: 0; font-weight: 600; }
  header .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); }
  header .sub { color: var(--muted); font-size: 12px; margin-left: auto; }
  #chat { flex: 1; overflow-y: auto; padding: 20px; max-width: 820px; width: 100%; margin: 0 auto; }
  .msg { margin-bottom: 18px; display: flex; flex-direction: column; }
  .msg .bubble {
    padding: 12px 16px; border-radius: 12px; line-height: 1.5;
    white-space: pre-wrap; max-width: 85%;
  }
  .msg.user { align-items: flex-end; }
  .msg.user .bubble { background: var(--user); }
  .msg.bot .bubble { background: var(--bot); }
  .meta { font-size: 12px; color: var(--muted); margin-top: 6px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .badge { padding: 2px 8px; border-radius: 10px; font-size: 11px; font-weight: 600; }
  .badge.high { background: #1c4532; color: #68d391; }
  .badge.medium { background: #4a3a1a; color: #f6ad55; }
  .badge.low { background: #4a1c1c; color: #fc8181; }
  .badge.out_of_scope, .badge.unavailable { background: #2d3139; color: var(--muted); }
  .source { background: #2a2e38; padding: 2px 8px; border-radius: 10px; font-size: 11px; }
  .fb button {
    background: none; border: 1px solid var(--border); color: var(--muted);
    border-radius: 6px; cursor: pointer; padding: 2px 8px; font-size: 12px;
  }
  .fb button:hover { color: var(--text); border-color: var(--muted); }
  .fb button.active { color: var(--accent); border-color: var(--accent); }
  footer { padding: 16px 20px; border-top: 1px solid var(--border); background: var(--panel); }
  .input-row { display: flex; gap: 10px; max-width: 820px; margin: 0 auto; }
  #q {
    flex: 1; padding: 12px 14px; border-radius: 10px; border: 1px solid var(--border);
    background: var(--bg); color: var(--text); font-size: 14px; outline: none;
  }
  #q:focus { border-color: var(--accent); }
  #send {
    padding: 12px 20px; border-radius: 10px; border: none; background: var(--accent);
    color: #0f1115; font-weight: 600; cursor: pointer; font-size: 14px;
  }
  #send:disabled { opacity: 0.5; cursor: not-allowed; }
  .hint { color: var(--muted); font-size: 12px; text-align: center; margin-top: 8px; }
</style>
</head>
<body>
  <header>
    <span class="dot"></span>
    <h1>Acme Corp Assistant</h1>
    <span class="sub">RAG over HR · Technical · Project Wiki</span>
  </header>

  <div id="chat">
    <div class="msg bot">
      <div class="bubble">Hi — ask me about HR policies, technical docs, or project wikis. For example: "How many PTO days do I get in my first year?"</div>
    </div>
  </div>

  <footer>
    <div class="input-row">
      <input id="q" placeholder="Ask a question…" autocomplete="off" />
      <button id="send">Send</button>
    </div>
    <div class="hint">Answers are grounded in the knowledge base and cite their sources. Out-of-scope questions are declined.</div>
  </footer>

<script>
const SESSION_ID = "web-" + Math.random().toString(36).slice(2, 8);
const chat = document.getElementById("chat");
const input = document.getElementById("q");
const send = document.getElementById("send");

function addMessage(role) {
  const wrap = document.createElement("div");
  wrap.className = "msg " + role;
  const bubble = document.createElement("div");
  bubble.className = "bubble";
  wrap.appendChild(bubble);
  chat.appendChild(wrap);
  chat.scrollTop = chat.scrollHeight;
  return { wrap, bubble };
}

function renderMeta(wrap, meta, userQuery, answerText) {
  const m = document.createElement("div");
  m.className = "meta";

  if (meta.confidence_level) {
    const b = document.createElement("span");
    b.className = "badge " + meta.confidence_level;
    const label = meta.confidence_level.replace("_", " ");
    b.textContent = meta.confidence != null && meta.confidence > 0
      ? `${label} (${meta.confidence})` : label;
    m.appendChild(b);
  }
  (meta.sources || []).forEach(s => {
    const el = document.createElement("span");
    el.className = "source";
    el.textContent = "📄 " + s;
    m.appendChild(el);
  });

  // thumbs up/down feedback
  const fb = document.createElement("span");
  fb.className = "fb";
  ["up", "down"].forEach(rating => {
    const btn = document.createElement("button");
    btn.textContent = rating === "up" ? "👍" : "👎";
    btn.onclick = async () => {
      await fetch("/feedback", {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ session_id: SESSION_ID, query: userQuery,
          response: answerText(), rating })
      });
      fb.querySelectorAll("button").forEach(x => x.classList.remove("active"));
      btn.classList.add("active");
    };
    fb.appendChild(btn);
  });
  m.appendChild(fb);
  wrap.appendChild(m);
}

async function ask(query) {
  addMessage("user").bubble.textContent = query;
  const { wrap, bubble } = addMessage("bot");
  bubble.textContent = "…";

  let meta = {};
  let answer = "";
  const answerText = () => answer;

  try {
    const res = await fetch("/query/stream", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ query, session_id: SESSION_ID })
    });
    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    let buffer = "";

    while (true) {
      const { value, done } = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, { stream: true });
      const lines = buffer.split("\n\n");
      buffer = lines.pop();
      for (const line of lines) {
        if (!line.startsWith("data: ")) continue;
        const event = JSON.parse(line.slice(6));
        if (event.type === "meta") {
          meta = event;
        } else if (event.type === "token") {
          if (answer === "") bubble.textContent = "";
          answer += event.content;
          bubble.textContent = answer;
          chat.scrollTop = chat.scrollHeight;
        } else if (event.type === "done") {
          renderMeta(wrap, meta, query, answerText);
        }
      }
    }
  } catch (e) {
    bubble.textContent = "Error: " + e.message;
  }
}

function submit() {
  const query = input.value.trim();
  if (!query) return;
  input.value = "";
  send.disabled = true;
  ask(query).finally(() => { send.disabled = false; input.focus(); });
}

send.onclick = submit;
input.addEventListener("keydown", e => { if (e.key === "Enter") submit(); });
input.focus();
</script>
</body>
</html>
